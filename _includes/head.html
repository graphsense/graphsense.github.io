<head>
  {% if jekyll.environment != "development" %}
  <!-- Privacy-friendly analytics by Plausible -->
  <script async src="https://plausible.io/js/pa-o7mBut-jv9DJou8MEDA9w.js"></script>
  <script>
    window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
    plausible.init()
  </script>
  {% endif %}
  <!-- Site head -->
  <link rel="icon" type="image/png" href="{{ '/assets/img/favicon.png' | relative_url }}">
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  {%- include structured-data.html -%}
  <link rel="stylesheet" href="{{ '/assets/css/bootstrap.min.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/fontawesome/css/all.min.css' | relative_url }}">
  {%- feed_meta -%}
  {% if jekyll.environment == "development" %}
  <script src="https://livejs.com/live.js"></script>
  {% endif %}
  <!-- Bootstrap 5 JavaScript (no jQuery required) -->
  <script src="{{ '/assets/javascript/bootstrap5/bootstrap.bundle.min.js' | relative_url }}"></script>
</head>
